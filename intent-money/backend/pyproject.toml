[project]
name = "intent-money-backend"
version = "0.1.0"
description = "Intent Money OS Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "python-jose[cryptography]",
    "cryptography",
    "passlib[bcrypt]",
    "python-multipart",
    "httpx",
    "structlog",
    "openai>=1.0.0",
    "snownlp>=0.12.3",
    "requests>=2.34.2",
    "playwright",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
