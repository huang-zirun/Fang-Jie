<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intent Money Cookie Helper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8f9fa;
      color: #1a1a2e;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px 20px;
      color: #fff;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .header p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .content {
      padding: 16px 20px;
    }
    .platform-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .platform-btn {
      flex: 1;
      padding: 8px 0;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      color: #666;
    }
    .platform-btn.active {
      border-color: #667eea;
      background: #f0f0ff;
      color: #667eea;
    }
    .platform-btn:hover {
      border-color: #667eea;
    }
    .status-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #eee;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .status-row + .status-row {
      margin-top: 8px;
    }
    .status-label {
      color: #888;
    }
    .status-value {
      font-weight: 500;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .status-dot.online {
      background: #4caf50;
    }
    .status-dot.offline {
      background: #f44336;
    }
    .status-dot.unknown {
      background: #ff9800;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #fff;
      color: #667eea;
      border: 1.5px solid #667eea;
    }
    .btn-secondary:hover {
      background: #f0f0ff;
    }
    .btn-primary:disabled,
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .result-area {
      margin-top: 12px;
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #eee;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      word-break: break-all;
      color: #555;
      display: none;
    }
    .result-area.visible {
      display: block;
    }
    .result-area.error {
      border-color: #ffcdd2;
      color: #c62828;
      background: #fff5f5;
    }
    .result-area.success {
      border-color: #c8e6c9;
      color: #2e7d32;
      background: #f1f8f1;
    }
    .server-url {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Intent Money Cookie Helper</h1>
    <p>获取平台Cookie用于账号绑定</p>
  </div>
  <div class="content">
    <div class="platform-selector">
      <button class="platform-btn active" data-platform="xiaohongshu">小红书</button>
      <button class="platform-btn" data-platform="douyin">抖音</button>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">登录状态</span>
        <span class="status-value" id="loginStatus">
          <span class="status-dot unknown"></span>检测中...
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Cookie数量</span>
        <span class="status-value" id="cookieCount">-</span>
      </div>
      <div class="status-row">
        <span class="status-label">上次同步</span>
        <span class="status-value" id="lastSync">-</span>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn btn-primary" id="btnGetCookies">获取Cookie并同步</button>
      <button class="action-btn btn-secondary" id="btnOpenLogin">打开登录页</button>
    </div>

    <div class="result-area" id="resultArea"></div>

    <div class="server-url" id="serverUrlDisplay">服务器: 检测中...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
