services:
  backend:
    build:
      context: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/intent_money.db}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat-v3-0324:free}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENV: ${ENV:-production}
      CDP_ENABLED: ${CDP_ENABLED:-false}
      CDP_DEBUG_HOST: ${CDP_DEBUG_HOST:-127.0.0.1}
      CDP_DEBUG_PORT: ${CDP_DEBUG_PORT:-9222}
      CDP_DEBUG_SCHEME: ${CDP_DEBUG_SCHEME:-http}
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: ../frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
