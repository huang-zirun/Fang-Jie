services:
  backend:
    build:
      context: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/intent_money.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat-v3-0324:free}
      XHS_COOKIE: ${XHS_COOKIE:-}
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_GATEWAY: ${SMS_GATEWAY:-}
      SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
      SCRAPER_ENABLED: ${SCRAPER_ENABLED:-true}
      SCRAPER_TIMEOUT: ${SCRAPER_TIMEOUT:-30}
      SENTIMENT_ENABLED: ${SENTIMENT_ENABLED:-true}
      AUTO_PUBLISH_ENABLED: ${AUTO_PUBLISH_ENABLED:-false}
      SOCIAL_AUTO_UPLOAD_PATH: ${SOCIAL_AUTO_UPLOAD_PATH:-}
      COOKIE_DIR: ${COOKIE_DIR:-cookies}
      COOKIE_EXPIRE_DAYS: ${COOKIE_EXPIRE_DAYS:-7}
      CDP_ENABLED: ${CDP_ENABLED:-false}
      CDP_DEBUG_HOST: ${CDP_DEBUG_HOST:-127.0.0.1}
      CDP_DEBUG_PORT: ${CDP_DEBUG_PORT:-9222}
      CDP_DEBUG_SCHEME: ${CDP_DEBUG_SCHEME:-http}
      ENV: ${ENV:-production}
      DEV_MODE: ${DEV_MODE:-false}
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: ../frontend
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9090:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
