services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/intent_money.db
      ENV: production
      DEV_MODE: "false"
      SCRAPER_ENABLED: "false"
      AUTO_PUBLISH_ENABLED: "false"
      SOCIAL_AUTO_UPLOAD_PATH: ""
    volumes:
      - db_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ../frontend
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9090:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
